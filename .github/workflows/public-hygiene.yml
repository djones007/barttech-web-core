name: Public Hygiene

# This repo is public. It must contain generic mechanism only — no internal
# project names, org-internal domains, or operational narrative. The term list
# is deliberately NOT in this file (a committed denylist would republish the
# strings it polices); it lives in the ESTATE_DENYLIST repo secret, one term
# per line, matched case-insensitively as fixed strings against the whole tree.
#
# Runs on push to main only — never on pull_request, so the secret is never
# exposed to a fork's workflow context. If the secret is missing the job FAILS
# (fail closed): an unset denylist means the gate is not checking anything.
#
# TWO FAILURE MODES, REPORTED SEPARATELY (added 2026-08-30 after a live case).
# The denylist is a repo SECRET, edited outside CI and only exercised on the
# next push — so an over-broad entry (a substring of the org name, a module
# name, a short common word) lands silently and then fails EVERY repo running
# this gate simultaneously. That is indistinguishable, from the outside, from
# a real estate-wide leak, and the instinct it provokes is to edit the repos.
#
# It happened here: a term matching this repo's own module filename failed the
# run, matching package.json, README.md and most modules at once. A re-run
# passed on identical code, because the secret had been corrected in between.
#
# The scan now classifies a hit before reporting it, and says which thing to
# fix. It still fails closed either way — an over-broad term means the gate
# cannot do its job, which is not a pass — but it never again tells someone
# their repo is leaking when the denylist is the thing that is wrong.
#
# REGEX-ESCAPE BLIND SPOT (found 2026-09-01, closed in this run). `grep
# --fixed-strings` only matches a denylist term byte-for-byte, so a literal
# written as REGEX SOURCE — e.g. a domain inside a `new RegExp(...)` pattern,
# where `example.com` is spelled `example\.com` so the dot doesn't match any
# character — never matches a denylist term of `example.com`. That is exactly
# how a hardcoded personal domain sat in this repo's own `validation.ts`
# through three green runs. The scan now also greps a de-escaped MIRROR of the
# tree (every `\` immediately before a regex metacharacter stripped), so a
# regex-escaped literal reads the same as the bare one a denylist term expects.
#
# SEPARATOR BLIND SPOT (found by the 2026-11-01 audit, closed in this run).
# Fixed-string matching also misses a term spelled with different separators:
# a term `brand name` never matches `brand_name`, `brand-name` or `brandname`
# in the tree, and a term `brand-name` never matches `brand_name`. That is how a
# private filename in snake_case and a kebab-case slug sat in this tree through
# green runs. The scan now ALSO greps a separator-collapsed mirror (spaces,
# underscores and hyphens removed from the de-escaped text) against each term
# with the same three characters removed. The fixed-string pass is unchanged.
#
# One carve-out, derived from the tree rather than listed by hand: env-var
# NAMES the modules read (`process.env.NAME` / `process.env["NAME"]`) are
# removed from the collapsed mirror before collapsing. They are public module
# API a consumer has to set, the same accepted residual as module filenames,
# and collapsing them can manufacture a match the raw tree does not contain.
# The fixed-string pass still sees them.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Scan tree against denylist
        env:
          ESTATE_DENYLIST: ${{ secrets.ESTATE_DENYLIST }}
        run: |
          if [ -z "$ESTATE_DENYLIST" ]; then
            echo "::error::ESTATE_DENYLIST secret is not set — hygiene gate cannot run. Failing closed."
            exit 1
          fi
          printf '%s\n' "$ESTATE_DENYLIST" | sed '/^[[:space:]]*$/d' > /tmp/denylist.txt

          # Every scannable path, listed once. Used both to size the tree and to spot a
          # term that matches a FILE NAME — a strong over-broad signal, since this repo's
          # own module names are public by construction.
          find . -type f -not -path './.git/*' -not -path './node_modules/*' > /tmp/allfiles.txt
          TOTAL=$(wc -l < /tmp/allfiles.txt | tr -d ' ')

          # De-escaped mirror of the tree — see the header comment. Python, not
          # sed, so this behaves identically regardless of the runner's sed
          # dialect; a wrong regex here would silently reopen the blind spot.
          python3 - <<'PYEOF'
          import pathlib, re, shutil

          pattern = re.compile(r'\\([.^$*+?(){}|\[\]\\])')
          env_re = re.compile(r'process\.env(?:\.([A-Z][A-Z0-9_]*)|\[\s*["\']([A-Z][A-Z0-9_]*)["\']\s*\])')
          sep_re = re.compile(r'[ _-]')
          mirror = pathlib.Path("/tmp/deescaped")
          collapsed = pathlib.Path("/tmp/collapsed")
          for m in (mirror, collapsed):
              if m.exists():
                  shutil.rmtree(m)
              m.mkdir(parents=True)

          with open("/tmp/allfiles.txt") as fh:
              rels = [line.rstrip("\n") for line in fh if line.strip()]

          texts = {}
          for rel in rels:
              try:
                  texts[rel] = pathlib.Path(rel).read_text(errors="ignore")
              except Exception:
                  texts[rel] = None

          # Env-var names read anywhere in the tree (see header): longest first so
          # a name that prefixes another is not stripped out of it first.
          env_names = set()
          for text in texts.values():
              if text:
                  for a, b in env_re.findall(text):
                      env_names.add(a or b)
          env_names = sorted(env_names, key=len, reverse=True)

          for rel in rels:
              src = pathlib.Path(rel)
              tail = rel[2:] if rel.startswith("./") else rel
              text = texts[rel]
              for root in (mirror, collapsed):
                  dest = root / tail
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  if text is None:
                      try:
                          shutil.copy(src, dest)
                      except Exception:
                          pass
              if text is None:
                  continue
              deesc = pattern.sub(r"\1", text)
              (mirror / tail).write_text(deesc)
              flat = deesc
              for name in env_names:
                  flat = flat.replace(name, "")
              (collapsed / tail).write_text(sep_re.sub("", flat))
          PYEOF

          LEAKS=0
          BROAD=0
          while IFS= read -r term; do
            IDX=$(grep -nxF -- "$term" /tmp/denylist.txt | head -1 | cut -d: -f1)
            MATCHES_RAW=$(grep -riIl --fixed-strings --exclude-dir=.git --exclude-dir=node_modules -- "$term" . || true)
            MATCHES_DEESC_RAW=$(grep -riIl --fixed-strings -- "$term" /tmp/deescaped || true)
            # Map mirror hits back to real repo paths so reporting/classification
            # (filename match, structural files, path-based signals) stays about
            # the actual tree, never the scratch mirror.
            MATCHES_DEESC=$(printf '%s\n' "$MATCHES_DEESC_RAW" | sed 's#^/tmp/deescaped/#./#')
            # Separator-collapsed pass (see header). Skipped when the collapsed term
            # is under 4 chars — too short to mean anything once separators go.
            CTERM=$(printf '%s' "$term" | tr -d ' _-')
            MATCHES_COLL=""
            if [ "${#CTERM}" -ge 4 ]; then
              MATCHES_COLL=$(grep -riIl --fixed-strings -- "$CTERM" /tmp/collapsed | sed 's#^/tmp/collapsed/#./#' || true)
            fi
            MATCHES=$(printf '%s\n%s\n%s\n' "$MATCHES_RAW" "$MATCHES_DEESC" "$MATCHES_COLL" | sed '/^$/d' | sort -u)
            [ -z "$MATCHES" ] && continue
            COUNT=$(printf '%s\n' "$MATCHES" | sed '/^$/d' | wc -l | tr -d ' ')

            # --- Is this a bad TERM rather than a leak? ---------------------------------
            # A denylist lives in a repo secret, edited outside CI, and is only exercised
            # on the next push. So an over-broad entry — a substring of the org name, a
            # module name, a common English word — lands silently and then fails EVERY
            # repo running this gate at once. That reads as mass estate breakage when it
            # is a one-character secret edit, which is the single most expensive way this
            # gate can be wrong. Three signals, any one of which means "fix the secret,
            # not the repo":
            NAME_HITS=$(grep -icF -- "$term" /tmp/allfiles.txt || true)
            if [ "$NAME_HITS" -eq 0 ] && [ "${#CTERM}" -ge 4 ]; then
              NAME_HITS=$(tr -d ' _-' < /tmp/allfiles.txt | grep -icF -- "$CTERM" || true)
            fi
            STRUCTURAL=0
            printf '%s\n' "$MATCHES" | grep -qxE '\./(package\.json|package-lock\.json|README\.md)' && STRUCTURAL=1
            WIDE=0
            [ "$TOTAL" -gt 0 ] && [ $((COUNT * 4)) -gt "$TOTAL" ] && WIDE=1
            SHORT=0
            [ "${#term}" -lt 4 ] && SHORT=1

            if [ "$NAME_HITS" -gt 0 ] || [ "$STRUCTURAL" -eq 1 ] || [ "$WIDE" -eq 1 ] || [ "$SHORT" -eq 1 ]; then
              BROAD=1
              # Counts and flags only — never the term, and never the paths. A path can
              # BE the term (a module filename), which is how the term would leak into a
              # public log.
              echo "::error::Denylist term #${IDX} looks OVER-BROAD: matched ${COUNT}/${TOTAL} files (filename-match=${NAME_HITS}, structural=${STRUCTURAL}, wide=${WIDE}, too-short=${SHORT}). This is almost certainly a DENYLIST problem, not a leak in this repo — fix the ESTATE_DENYLIST secret. Do NOT edit the repo to satisfy it."
              continue
            fi

            LEAKS=1
            echo "::error::Denylisted term #${IDX} found in: $(echo "$MATCHES" | tr '\n' ' ')"
          done < /tmp/denylist.txt

          if [ "$BROAD" -ne 0 ]; then
            echo "::error::At least one denylist TERM is too broad to be meaningful. Every repo running this gate will be failing on it right now. Fix the secret; a green run here needs no repo change."
          fi
          if [ "$LEAKS" -ne 0 ]; then
            echo "::error::Tree contains denylisted content. See the private denylist for term numbers."
          fi
          if [ "$BROAD" -ne 0 ] || [ "$LEAKS" -ne 0 ]; then
            exit 1
          fi
          echo "Tree clean against $(wc -l < /tmp/denylist.txt | tr -d ' ') denylisted terms (${TOTAL} files scanned)."
