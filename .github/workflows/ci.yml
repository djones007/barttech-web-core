name: CI

# web-core is consumed as a git submodule by 9+ repos. Until 2026-07-25 it had no CI
# of its own and was linted only as a side effect of being vendored into consumers —
# which meant a lint error introduced here reddened every consumer's build at once,
# against files none of them is allowed to edit (a fix there is lost on the next
# pointer bump). The gate belongs where the source lives. Consumers now exclude
# src/web-core/** from their own lint.
#
# One job, not three: GitHub rounds every job up to a full billed minute
# (see memory/feedback_github_actions_billing.md). This repo is public, so its
# minutes are free — but the estate pattern stays consistent.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `if: always()` so a lint failure never hides a type error — both are
      # reported in one run rather than one masking the other.
      - if: always()
        run: npm run typecheck
      # Added 2026-08-08 after safeHtml shipped a content regression (`target`
      # stripped from every anchor) that lint and typecheck cannot see. This repo
      # is vendored into ~19 consumers, so a behaviour change here is a behaviour
      # change everywhere — it needs assertions, not just a clean compile.
      - if: always()
        run: npm test
      - if: always()
        run: npm audit --audit-level=high

      # Every module MUST be declared in shared-modules.json — including modules
      # that own nothing, which say so explicitly with a `why`. That declaration
      # is what each consumer's resource-registration gate reads, so an
      # undeclared module is one no consumer can be asked to register, and the
      # copy it was meant to prevent can reappear downstream unnoticed.
      #
      # An empty `resources` is a decision. A missing entry is an oversight.
      # If those two look the same, the manifest rots into a list of the things
      # someone happened to remember.
      #
      # This is the ONE gate that belongs on this repo. The consumer-side gates
      # deliberately are not here: a gate belongs on the repos that could drift,
      # never on the canonical source they are measured against.
      - name: Every module is declared in shared-modules.json
        if: always()
        run: |
          node - <<'EOF'
          const fs = require("fs");
          const man = JSON.parse(fs.readFileSync("shared-modules.json", "utf8")).modules || {};
          // `*.test.ts` is a test for a module, not a module — it owns no
          // resources and has nothing to declare. Without this exclusion the
          // first test file added here fails this gate on its own name.
          const onDisk = fs.readdirSync(".")
            .filter((f) => f.endsWith(".ts") && !f.endsWith(".test.ts"))
            .map((f) => f.replace(/\.ts$/, ""));
          const undeclared = onDisk.filter((m) => !(m in man));
          const phantom = Object.keys(man).filter((m) => !onDisk.includes(m));
          const noReason = Object.entries(man)
            .filter(([, v]) => !(v.resources || []).length && !v.why)
            .map(([k]) => k);
          let failed = false;
          if (undeclared.length) {
            failed = true;
            console.log("::error::Module(s) with no shared-modules.json entry. Add one naming the external resources it owns — or an empty `resources` WITH a `why` if it owns none. Consumers cannot be asked to register what is not declared.");
            undeclared.forEach((m) => console.log("  " + m + ".ts"));
          }
          if (phantom.length) {
            failed = true;
            console.log("::error::shared-modules.json declares a module that no longer exists. Remove the entry.");
            phantom.forEach((m) => console.log("  " + m));
          }
          if (noReason.length) {
            failed = true;
            console.log("::error::Module declares no resources and gives no `why`. 'Owns nothing' must be a stated decision, not an empty field.");
            noReason.forEach((m) => console.log("  " + m));
          }
          if (failed) process.exit(1);
          console.log(`Manifest gate OK — all ${onDisk.length} module(s) declared.`);
          EOF
